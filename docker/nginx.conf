# The SPA's nginx (PLAN-rule-editor §4.2 shape 2): static files + a same-origin proxy of
# the API. Rendered from a template by the official image at start-up; ${API_UPSTREAM}
# and ${BRAND} are the only substituted variables (Dockerfile: NGINX_ENVSUBST_FILTER).
#
# This is the reference configuration for ANY reverse proxy in front of the two apps:
# what it forwards, and that it forwards it on the same origin, is the contract.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, the OpenAPI document and Swagger UI go to the rest app unchanged.
    # ⚠ Host is $http_host — the browser's host WITH its port — never $host (no port): Spring
    # compares the request's Origin with scheme://Host, so behind a published port such as
    # :8080 a portless Host makes every same-origin POST look cross-origin and the login
    # answers "403 Invalid CORS request" (the CORS allow-list is empty in this shape).
    # No path rewriting: the rest app's cookie path is /, its CSRF endpoint is under /api.
    location ^~ /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A rule file or a commit can take a moment; the login clones the workspace.
        proxy_read_timeout 300s;
        # The largest request is a run: rule + docs + scenario buffers, each at most the rest
        # app's editor.engine.max-buffer-bytes (1 MiB by default), JSON-escaped. The rest app
        # caps a body at editor.limits.max-request-bytes (default: four buffers' worth, 4 MiB);
        # this must be AT LEAST that — never below — and stops anything larger here, before the
        # rest app reads it (security review M2). Raise both together.
        client_max_body_size 4m;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $http_host;
    }
    location ^~ /swagger-ui {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $http_host;
    }
    location = /swagger-ui.html {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $http_host;
    }

    # The SPA's own responses carry the security headers. ⚠ nginx inherits add_header from the
    # server level ONLY into a location that has none of its own, and both locations below set
    # Cache-Control — so the headers are repeated in each (an include file would need a second
    # COPY in the Dockerfile). The rest app sets its own on /api.
    #
    # The CSP is the one the SPA was measured to run under (a headless browser, no violation,
    # CodeMirror and Mantine styled): scripts only from this origin (Vite emits no inline
    # script), styles from this origin plus inline — Mantine writes <style> elements and
    # CodeMirror injects its theme at run time — images also as data: / blob:, fetches only to
    # this origin, never framed (frame-ancestors; X-Frame-Options for older browsers).

    # Hashed Vite assets: immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The brand (PLAN-web-branding-and-theme §5.5): the SPA always loads /brand/brand.css, and
    # /brand/ is the folder ${BRAND} names under brands/ (substituted at start-up; the default is
    # neutral, docker/25-cumba-brand.sh has refused to start on a name without a brand.css).
    # Extra brands are mounted at /usr/share/nginx/html/brands/<name>. no-cache so an edited
    # brand shows on reload; the security headers repeated (see the note above).
    location ^~ /brand/ {
        alias /usr/share/nginx/html/brands/${BRAND}/;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The SPA has no client-side routes today; a deep link still lands on index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
